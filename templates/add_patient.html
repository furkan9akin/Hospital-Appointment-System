<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Appointment System - Add Patient</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav>

    <div class="nav-container">

        <h1>Hospital Appointment System</h1>

        <ul>
            <li><a href="{{ url_for('index') }}">Dashboard</a></li>
            <li><a href="{{ url_for('appointments') }}">Appointments</a></li>
            <li><a href="{{ url_for('patients') }}">Patients</a></li>
            <li><a href="{{ url_for('doctors') }}">Doctors</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
        </ul>

    </div>

</nav>


<main>

    <div class="container">

        <div class="section-header"
             style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">

            <h2>Add Patient</h2>

            <a href="{{ url_for('patients') }}"
               class="btn">
                ← Back to Patients
            </a>

        </div>


        <form method="POST"
              class="patient-form">

            <div class="form-row">

                <div class="form-group">

                    <label for="first_name">
                        First Name *
                    </label>

                    <input type="text"
                           id="first_name"
                           name="first_name"
                           required
                           placeholder="Patient's first name">

                </div>


                <div class="form-group">

                    <label for="last_name">
                        Last Name *
                    </label>

                    <input type="text"
                           id="last_name"
                           name="last_name"
                           required
                           placeholder="Patient's last name">

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="phone">
                        Phone *
                    </label>

                    <input type="tel"
                           id="phone"
                           name="phone"
                           required
                           placeholder="+1 555 123 4567">

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="patient@example.com">

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="date_of_birth">
                        Date of Birth
                    </label>

                    <input type="date"
                           id="date_of_birth"
                           name="date_of_birth">

                </div>


                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <input type="text"
                           id="address"
                           name="address"
                           placeholder="Patient address">

                </div>

            </div>


            <div class="form-actions"
                 style="display:flex; gap:1rem; justify-content:center; margin-top:2rem;">

                <button type="submit"
                        class="btn">
                    Save Patient
                </button>

                <a href="{{ url_for('patients') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>


<footer>
    <p>Hospital Appointment System · Educational software project</p>
</footer>

</body>

</html>
